<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AR Interyer Dizayni</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="js/hit-test.js"></script>
<script src="js/light.js"></script>
<script src="js/furniture.js"></script>
<script src="js/app.js" defer></script>
<style>
:root{--ink:#1b2230;--paper:#f3efe6;--oak:#e0a040;--glass:rgba(27,34,48,.82)}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--paper)}
button{font:inherit;color:inherit;border:1px solid rgba(243,239,230,.35);background:var(--glass);border-radius:10px;padding:10px 14px;min-height:44px}
button.on{background:var(--oak);color:var(--ink);border-color:var(--oak);font-weight:600}
button:disabled{opacity:.5}
#intro{position:fixed;inset:0;z-index:10;background:var(--ink);display:flex;flex-direction:column;justify-content:center;padding:0 28px;max-width:30rem;margin:0 auto;gap:14px}
#intro h1{font-size:2.1rem;line-height:1.1;margin:0}
#intro p{margin:0;line-height:1.5;color:#c9c5ba}
#intro #start{background:var(--oak);color:var(--ink);font-weight:700;font-size:1.1rem;border:0;margin-top:6px}
#msg{color:#ffb3a0}
body.ar #intro{display:none}
#overlay{position:fixed;inset:0;pointer-events:none;touch-action:none}
body.ar #overlay{pointer-events:auto}
#ui{display:none}
body.ar #ui{display:block}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;display:flex;flex-direction:column;gap:4px}
#top span{align-self:flex-start;background:var(--glass);border-radius:8px;padding:6px 10px;font-size:.9rem}
#info{font-size:.75rem!important;color:#c9c5ba}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:8px}
#bottom div{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<div id="intro">
  <h1>Mebelni xonangizda ko‘ring</h1>
  <p>Telefon kamerasini polga qarating, halqa paydo bo‘lgach ekranga teging: mebel shu yerga joylashadi.</p>
  <button id="start">AR ni boshlash</button>
  <p id="msg"></p>
</div>

<a-scene xr-mode-ui="enabled: false" light-adapt
  webxr="referenceSpaceType: local; requiredFeatures: hit-test; optionalFeatures: dom-overlay, light-estimation; overlayElement: #overlay">
  <a-light id="amb" type="ambient" intensity="0.7" color="#ffffff"></a-light>
  <a-light id="sun" type="directional" intensity="0.8" position="1 3 1"></a-light>
  <a-entity id="reticle" hit-test visible="false">
    <a-ring radius-inner="0.08" radius-outer="0.1" rotation="-90 0 0" material="color:#fff;shader:flat;side:double"></a-ring>
    <a-circle radius="0.015" rotation="-90 0 0" material="color:#fff;shader:flat;side:double"></a-circle>
  </a-entity>
</a-scene>

<div id="overlay">
  <div id="ui">
    <div id="top"><span id="status">Tekislik qidirilmoqda…</span><span id="info"></span></div>
    <div id="bottom">
      <div id="models"></div>
      <div>
        <button id="next">Keyingisi</button>
        <button id="del">O‘chirish</button>
        <button id="clear">Tozalash</button>
        <button id="exit">Chiqish</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
